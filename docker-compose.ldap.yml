services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: blog_openldap
    environment:
      LDAP_ORGANISATION: "Blog Development"
      LDAP_DOMAIN: "example.org"
      LDAP_ADMIN_PASSWORD: "dev-admin-password"
      LDAP_TLS: "false"
    ports:
      - "127.0.0.1:3890:389"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    restart: unless-stopped

volumes:
  ldap_data:
  ldap_config:
